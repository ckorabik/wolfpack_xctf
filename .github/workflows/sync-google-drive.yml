name: Sync website with Google Drive

on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: Preview changes without publishing
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: google-drive-site-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google API client
        run: python -m pip install --disable-pip-version-check -r scripts/sync-requirements.txt

      - name: Refresh website data
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SCHEDULE_SPREADSHEET_ID: ${{ vars.SCHEDULE_SPREADSHEET_ID || '19gePPoZ1uYQoIN2wbQ_1B5hOrCZtNCpC2oKx0Mxaad0' }}
          ROSTER_SPREADSHEET_ID: ${{ vars.ROSTER_SPREADSHEET_ID || '1NdQhlH_nHeRzazzJbt2AIiRyicnYyNNk-VSgOVsGunY' }}
        run: python scripts/sync_google_drive.py

      - name: Show generated changes
        run: git diff --stat && git diff --check

      - name: Save preview patch
        if: ${{ inputs.preview_only }}
        run: git diff --binary > google-drive-sync.patch

      - name: Upload preview
        if: ${{ inputs.preview_only }}
        uses: actions/upload-artifact@v4
        with:
          name: google-drive-sync-preview
          path: google-drive-sync.patch
          if-no-files-found: error

      - name: Publish changed snapshots
        if: ${{ !inputs.preview_only }}
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Google Drive data already matches the website."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.html roster.js
          git commit -m "Sync website data from Google Drive"
          git push
